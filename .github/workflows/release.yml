# Release pipeline: test, cross-compile every platform, publish one
# GitHub Release with the archives and their checksums.
#
# Flow: test → build (matrix) → release
#
# Portolan is pure Go with no module dependencies and embeds its own
# assets, so every target cross-compiles from one Linux runner with
# CGO_ENABLED=0. There is no per-platform runner, no toolchain to
# install, and no signing — which is why this is one short job and not
# parchment's matrix of macOS and Android builders.
#
# GITHUB_TOKEN creates the release. The npm job needs NO secret at all —
# it publishes through trusted publishing, claiming a short-lived
# credential with this run's OIDC identity. That identity is registered on
# the package's settings page at npmjs.com against this repository and
# tag-release.yml; change either and publishing stops until the
# registration is updated to match. npm is a separate job, so a
# registration that has drifted costs the package and not the release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  # set by workflow_call from tag-release.yml, or by the tag that
  # triggered the push
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      # one platform failing to compile means the tree is broken, not
      # that platform — stop rather than publish a partial release
      fail-fast: true
      matrix:
        include:
          - { goos: darwin, goarch: arm64 } # Apple silicon
          - { goos: darwin, goarch: amd64 } # Intel Macs
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 } # servers, Raspberry Pi 4+
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${RELEASE_TAG#v}"
          BIN=portolan
          [ "$GOOS" = "windows" ] && BIN=portolan.exe
          # -trimpath keeps build paths out of the binary, so the same
          # source produces the same bytes wherever it is compiled;
          # -s -w drop the symbol and DWARF tables, which this has no
          # use for and which are most of the size
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN}" ./cmd/portolan
          ls -lh dist/

      - name: Assemble the archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="portolan_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "stage/${NAME}"
          cp dist/portolan* "stage/${NAME}/"
          # the curation documents ship WITH the binary: portolan looks
          # for ./style by default, so a download that omitted them
          # would draw every city in feed colours and look broken
          cp -R style "stage/${NAME}/style"
          cp README.md LICENSE "stage/${NAME}/"
          mkdir -p "stage/${NAME}/docs"
          cp docs/CLI.md docs/CORRIDORS.md docs/CITIES.md "stage/${NAME}/docs/"
          cd stage
          if [ "$GOOS" = "windows" ]; then
            zip -qr "../${NAME}.zip" "${NAME}"
          else
            tar -czf "../${NAME}.tar.gz" "${NAME}"
          fi
          cd ..
          ls -lh portolan_*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: portolan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            portolan_*.tar.gz
            portolan_*.zip
          retention-days: 1

  npm:
    name: Publish npm package
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # TRUSTED PUBLISHING. There is no NPM_TOKEN: npm mints a short-lived
      # credential from this run's OIDC identity, having been told on the
      # package's own settings page which repository and workflow may claim
      # it. A secret that leaks can publish from anywhere; an identity
      # cannot. Provenance is signed against the same identity, and comes
      # for free rather than by flag.
      #
      # id-token:write must ALSO be granted by tag-release.yml, which calls
      # this workflow — a workflow_call inherits the caller's permissions,
      # and a job asking for more than the caller holds fails the entire run
      # at startup with no log worth reading.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # e2e.test.js compiles a real engine and drives it before anything is
      # published. The manual runbook ran `npm test` at exactly this point and
      # dropping it would be the one difference between the two paths.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10, which has no idea OIDC exists — it would
      # look for a token, find none, and fail as though unauthenticated.
      # Trusted publishing needs 11.5.1 or later.
      - name: npm new enough to speak OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download every archive
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: portolan-*
          merge-multiple: true

      # The packages take their version from VERSION, the release takes its
      # own from the tag. They agree when tag-release.yml cut the tag; a tag
      # pushed by hand can disagree, and the result would be npm packages
      # numbered differently from the release they came from.
      - name: VERSION must agree with the tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "tag ${RELEASE_TAG} says ${TAG_VERSION}, VERSION says ${FILE_VERSION}"
            exit 1
          fi

      - name: Stage the engines from the released archives
        working-directory: clients/npm
        run: |
          npm ci
          # Reads the ARCHIVES rather than rebuilding, so what npm carries is
          # byte-identical to what the GitHub release carries.
          node scripts/build-universal.mjs --dist ../../artifacts

      - name: Test
        working-directory: clients/npm
        run: npm test

      - name: Publish
        working-directory: clients/npm
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < ../../VERSION)"
          NAME="$(node -p "require('./package.json').name")"

          # Already-published versions are SKIPPED rather than retried: npm
          # forbids republishing a version, so a re-run of a release that
          # failed AFTER the publish would otherwise never get past it.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "  already on the registry: ${NAME}@${VERSION}"
            exit 0
          fi

          # One package, carrying every platform's engine. This used to be
          # seven writes in a required order, and the ordering was load-
          # bearing: six optionalDependencies that npm skips SILENTLY when
          # they are missing, so a wrapper published a moment too early
          # installed clean and died at the consumer's first chart call.
          # No --provenance: trusted publishing attests automatically, and
          # passing the flag on top is how you get a run that demands a token
          # it was never given.
          echo "  publishing ${NAME}@${VERSION}"
          npm publish --access public

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download every archive
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: portolan-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum portolan_* > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        id: notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo "body<<PORTOLAN_EOF"
            # a CHANGELOG section for this version wins when one exists;
            # otherwise GitHub's generated commit list carries the release
            if [ -f CHANGELOG.md ] && grep -q "^## \[\?${VERSION}\]\?" CHANGELOG.md; then
              awk -v v="${VERSION}" '
                $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
                on && /^## / { exit }
                on { print }
              ' CHANGELOG.md
              echo
            fi
            echo "### Install"
            echo
            echo '```'
            echo "tar -xzf portolan_${VERSION}_darwin_arm64.tar.gz"
            echo "cd portolan_${VERSION}_darwin_arm64 && ./portolan help"
            echo '```'
            echo
            echo "Each archive holds the \`portolan\` binary, the \`style/\` curation"
            echo "documents it reads by default, and the reference docs. No runtime"
            echo "dependencies — it is a single static binary."
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS\`."
            echo "PORTOLAN_EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.body }}
          # append GitHub's own commit/PR summary below the notes above
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/portolan_*
            artifacts/SHA256SUMS
